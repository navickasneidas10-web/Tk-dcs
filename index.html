function fmtDate(iso){
  const d=new Date(iso+"T00:00:00");
  const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return String(d.getDate()).padStart(2,'0')+months[d.getMonth()];
}
function timeNoColon(t){ return (t||'--:--').replace(':',''); }
function seatWithDash(seat){
  if(!seat) return seat;
  const m = seat.match(/^(\d+)([A-Za-z])$/);
  return m ? `${m[1]}-${m[2]}` : seat;
}

/* Draws real Code128 barcodes (via bwip-js) for every canvas on the bag tag —
   same license-plate data repeated at different sizes, exactly like a real
   printed tag repeats its barcode for scan redundancy along the strip. */
function drawBagTagBarcodes(){
  document.querySelectorAll('.bagtag canvas[data-code]').forEach(el=>{
    const code = el.dataset.code;
    try{
      bwipjs.toCanvas(el, {
        bcid:'code128', text:code, scale:2,
        height: el.id.startsWith('bar-main') ? 70 : 8, // bar-main stays attached to the bag — much bigger; bar-second is the tear-off claim stub
        includetext:false, backgroundcolor:'FFFFFF', paddingwidth:2, paddingheight:1
      });
    }catch(e){ console.error('Code128 render failed', e); }
  });
}

/* =====================================================================
   TAB: BOARDING GATE / BOARDING CONTROL
   (progress bar + live seatmap + camera scan + manual boarding —
   modeled on real DCS boarding-control screens: flight progress,
   yet-to-board tracking, and a visual seatmap of who's on board)
===================================================================== */
let zxingControls=null;

function renderGate(){
  const flight = STATE.flights.find(f=>f.id===STATE.selection.flightId);
  const allCheckedInList = [];
  let totalCheckedIn = 0, totalBoarded = 0;
  if(flight){
    STATE.bookings.filter(b=>b.legs.includes(flight.id)).forEach(b=>{
      b.passengers.forEach(p=>{
        const ls = p.legs[flight.id];
        if(ls && ls.checkedIn){
          totalCheckedIn++;
          if(ls.boarded) totalBoarded++;
          allCheckedInList.push({ pnr:b.pnr, pax:p, legState:ls });
        }
      });
    });
  }
  allCheckedInList.sort((a,b)=> (a.legState.seq||'999').localeCompare(b.legState.seq||'999'));
  const notBoardedCount = totalCheckedIn - totalBoarded;
  const pct = totalCheckedIn>0 ? Math.round(totalBoarded/totalCheckedIn*100) : 0;

  const paxRows = allCheckedInList.map(x=>`
    <tr>
      <td>${x.legState.seq}</td>
      <td>${x.pax.title} ${x.pax.surname}/${x.pax.given}</td>
      <td>${x.legState.seat}</td>
      <td><span class="badge ${x.pax.cls}">${classCodeLetter(x.pax.cls)}</span></td>
      <td>${x.pnr}</td>
      <td><span class="badge ${x.legState.boarded?'boarded':'pending'}">${x.legState.boarded?'BOARDED':'NOT BOARDED'}</span></td>
      <td>${x.legState.boarded
        ? `<button class="btn small secondary" onclick="toggleSeatBoarded('${x.pnr}','${x.pax.key}','${flight.id}')">Unboard</button>`
        : `<button class="btn small" onclick="toggleSeatBoarded('${x.pnr}','${x.pax.key}','${flight.id}')">Board</button>`}</td>
    </tr>`).join('');

  return `
  <div class="panel">
    <div class="panel-title">Boarding Control ${flight?'— '+flight.flightNo+' '+flight.from+'-'+flight.to:''}</div>
    <div class="panel-body">
    ${!flight ? '<div class="empty">No active flight selected.</div>' : `
    <div class="boardsummary">
      <div class="bs-item"><label>Gate</label><span>${flight.gate}</span></div>
      <div class="bs-item"><label>Boarding</label><span>${flight.boarding}</span></div>
      <div class="bs-item"><label>STD</label><span>${flight.std}</span></div>
      <div class="bs-item"><label>Checked-In</label><span>${totalCheckedIn}</span></div>
      <div class="bs-item"><label>Boarded</label><span>${totalBoarded}</span></div>
      <div class="bs-item"><label>Remaining</label><span>${notBoardedCount}</span></div>
      <div class="bs-progress">
        <div class="boardbar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="pct">${pct}% boarded ${totalBoarded===totalCheckedIn && totalCheckedIn>0 ? '— READY FOR DEPARTURE' : ''}</div>
      </div>
    </div>
    `}
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Camera Scan</div>
    <div class="panel-body">
    <div class="row">
      <button class="btn" id="camToggleBtn" onclick="toggleCamera()">Enable Camera</button>
    </div>
    <div style="margin-top:14px;display:flex;gap:20px;flex-wrap:wrap;">
      <div class="cam-wrap">
        <video id="camVideo" autoplay playsinline muted></video>
        <div class="cam-frame"></div>
      </div>
      <div style="flex:1;min-width:260px">
        <div id="scanResult"></div>
        <small class="hint">Point the printed or on-screen PDF417 barcode (the tall code on the left of the Boarding Pass) at the camera. Decoding uses ZXing's real PDF417 reader. The system verifies the flight, sequence number, and whether the passenger has already boarded.</small>
      </div>
    </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Manual Boarding — Passenger List</div>
    <div class="panel-body">
    ${!flight ? '<div class="empty">No active flight selected.</div>' : allCheckedInList.length===0 ? '<div class="empty">No checked-in passengers on this flight yet.</div>' : `
    <table>
      <thead><tr><th>Seq</th><th>Passenger</th><th>Seat</th><th>Cl</th><th>PNR</th><th>Status</th><th></th></tr></thead>
      <tbody>${paxRows}</tbody>
    </table>
    <small class="hint">Board/Unboard works the same as scanning — toggling here updates the same status shown on the Live Seatmap below.</small>
    `}
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Live Seatmap — Boarding Status</div>
    <div class="panel-body">
    ${!flight ? '<div class="empty">No active flight selected.</div>' : renderGateSeatmapHTML(flight)}
    <div class="gate-legend">
      <span><span class="sw" style="background:#1a7f37"></span>Boarded</span>
      <span><span class="sw" style="background:#7a5a12"></span>Checked-in, not boarded</span>
      <span><span class="sw" style="background:#0e2a4a;border:1px solid #22344a"></span>Not checked-in / empty</span>
      <span><span class="sw" style="background:#0e2a4a;border:2px solid #ffb020"></span>Emergency Exit Row</span>
      <span style="color:#5a6b7d">Click a seat to toggle boarded status</span>
    </div>
    </div>
  </div>
  `;
}

function renderGateSeatmapHTML(flight){
  const ac = getAircraftByReg(flight.tailNumber);
  if(!ac) return '<div class="empty">This flight has no registered aircraft/cabin layout.</div>';
  const bySeat = {}; // seatId -> {pnr, pax, legState}
  STATE.bookings.filter(b=>b.legs.includes(flight.id)).forEach(b=>{
    b.passengers.forEach(p=>{
      const ls = p.legs[flight.id];
      if(ls && ls.seat) bySeat[ls.seat] = { pnr:b.pnr, pax:p, legState:ls };
    });
  });

  const masterLetters = getMasterLetters(ac);
  const aisleBefore = getAisleBeforeSet(ac);
  const gridCols = `24px repeat(${masterLetters.length}, 26px) auto`;

  let html = '<div class="gate-seatmap">';
  ['business','premium','economy'].forEach(cls=>{
    classRowDefs(ac, cls).forEach(rd=>{
      const rowNum = rd.row;
      const rowLetters = new Set();
      rd.groups.forEach(g=>g.forEach(l=>rowLetters.add(l)));
      html += `<div class="seatrow ${rd.exitRow?'exitrow':''}" style="display:grid;grid-template-columns:${gridCols};align-items:center;gap:3px;">`;
      html += `<div class="rownum">${rowNum}${rd.exitRow?' <span class="exit-tag" title="Emergency Exit Row">EXIT</span>':''}</div>`;
      masterLetters.forEach(letter=>{
        const gapStyle = aisleBefore.has(letter) ? 'margin-left:8px;' : '';
        if(!rowLetters.has(letter)){
          html += `<div class="seat-blank" style="${gapStyle}"></div>`;
          return;
        }
        const id = rowNum+letter;
        const occ = bySeat[id];
        let statusClass = 'notcheckedin';
        let title = 'Empty / not checked-in';
        let onclick = '';
        if(occ){
          if(occ.legState.checkedIn){
            statusClass = occ.legState.boarded ? 'boarded' : 'checkedin';
            title = `${occ.pax.surname}/${occ.pax.given} · PNR ${occ.pnr} · ${occ.legState.boarded?'BOARDED':'not boarded'}`;
            onclick = `onclick="toggleSeatBoarded('${occ.pnr}','${occ.pax.key}','${flight.id}')"`;
          }
        }
        html += `<div class="gate-seat ${statusClass} ${rd.exitRow?'exitrow':''}" style="${gapStyle}" title="${title}" ${onclick}>${letter}</div>`;
      });
      html += `<span class="badge ${cls}" style="margin-left:8px;justify-self:start;width:fit-content;">${classLabel(cls)}</span></div>`;
    });
  });
  html += '</div>';
  return html;
}

function toggleSeatBoarded(pnr,key,flightId){
  const booking = STATE.bookings.find(b=>b.pnr===pnr);
  const pax = booking && booking.passengers.find(p=>p.key===key);
  if(!pax) return;
  const ls = pax.legs[flightId];
  if(!ls || !ls.checkedIn) return;
  ls.boarded = !ls.boarded;
  saveState(); render();
}



function toggleCamera(){
  if(zxingControls){ stopCamera(); } else { startCamera(); }
}
async function startCamera(){
  try{
    const codeReader = new ZXingBrowser.BrowserPDF417Reader();
    const videoElem = document.getElementById('camVideo');
    zxingControls = await codeReader.decodeFromConstraints(
      { video:{ facingMode:'environment' } },
      videoElem,
      (result, err, controls) => {
        if(result){ handleScan(result.getText()); }
      }
    );
    document.getElementById('camToggleBtn').textContent='Disable Camera';
  }catch(e){
    document.getElementById('scanResult').innerHTML = `<div class="scan-result err">Could not access camera: ${e.message}. Check browser permissions.</div>`;
  }
}
function stopCamera(){
  if(zxingControls){ zxingControls.stop(); zxingControls=null; }
  const btn=document.getElementById('camToggleBtn'); if(btn) btn.textContent='Enable Camera';
}

let lastScanTime=0;
function handleScan(data){
  const now = Date.now();
  if(now-lastScanTime < 1500) return;
  lastScanTime = now;
  const resEl = document.getElementById('scanResult');
  const m = data.match(/^M1([A-Z\-']+)\/(\w)\s+([A-Z0-9]{5,7})\s([A-Z]{3})([A-Z]{3})(TK)\s(\d+)\s([A-Z])(\d+[A-Z])(\d+)/);
  if(!m){ resEl.innerHTML = `<div class="scan-result err">✕ Code not recognized (not a valid boarding pass for this system).</div>`; return; }
  const [,surname,,pnr,from,to,,fnum,clsLetter,seat,seq] = m;
  const flight = STATE.flights.find(f=>f.id===STATE.selection.flightId);
  if(!flight || flight.from!==from || flight.to!==to || flight.flightNo.replace(/\D/g,'')!==fnum){
    resEl.innerHTML = `<div class="scan-result err">✕ This boarding pass is for a different flight (${from}-${to} TK${fnum}), but the gate is set to ${flight?flight.flightNo:'-'}.</div>`; return;
  }
  const booking = STATE.bookings.find(b=>b.pnr===pnr && b.legs.includes(flight.id));
  const pax = booking && booking.passengers.find(p=>p.legs[flight.id]?.seq===seq);
  if(!pax){ resEl.innerHTML = `<div class="scan-result err">✕ Passenger not found in the manifest.</div>`; return; }
  const legState = pax.legs[flight.id];
  if(legState.boarded){ resEl.innerHTML = `<div class="scan-result err">✕ DUPLICATE — ${pax.surname}/${pax.given} already boarded (seat ${legState.seat}).</div>`; return; }
  legState.boarded = true; saveState();
  resEl.innerHTML = `<div class="scan-result ok">✓ BOARDED — ${pax.surname}/${pax.given} · seat ${legState.seat} · ${classLabel(pax.cls)}</div>`;
}
function initCameraIfNeeded(){ /* camera starts manually via button */ }

/* =====================================================================
   TAB: PAX MANIFEST
===================================================================== */
function renderManifest(){
  const flight = STATE.flights.find(f=>f.id===STATE.selection.flightId) || STATE.flights[0];
  if(!flight) return `<div class="panel"><div class="panel-body empty">No flights available.</div></div>`;
  const passengers = [];
  STATE.bookings.filter(b=>b.legs.includes(flight.id)).forEach(b=>{
    b.passengers.forEach(p=>{
      const ls = p.legs[flight.id] || {};
      passengers.push({ ...p, pnr:b.pnr, seat:ls.seat, seq:ls.seq, checkedIn:ls.checkedIn, boarded:ls.boarded, transfer: b.legs.length>1 });
    });
  });
  passengers.sort((a,b)=> (a.seq||'999').localeCompare(b.seq||'999'));

  const rows = passengers.map(p=>{
    const wt = (p.bagTags||[]).reduce((s,t)=>s+t.weight,0);
    return `
    <tr>
      <td>${p.seq||'—'}</td>
      <td>${p.title} ${p.surname}/${p.given}${p.transfer?' <span style="color:#5a6b7d">(TFR)</span>':''}</td>
      <td>${p.pnr}</td>
      <td style="font-size:11px">${p.eTicket||'—'}</td>
      <td><span class="badge ${p.cls}">${classCodeLetter(p.cls)}</span></td>
      <td>${p.seat||'—'}</td>
      <td>${p.bags}</td>
      <td>${wt.toFixed(1)}kg</td>
      <td><span class="badge ${p.checkedIn?'ok':'pending'}">${p.checkedIn?'CHECKED-IN':'NOT CHECKED-IN'}</span></td>
      <td><span class="badge ${p.boarded?'boarded':'pending'}">${p.boarded?'BOARDED':'—'}</span></td>
    </tr>`;
  }).join('');

  const total = passengers.length;
  const boarded = passengers.filter(p=>p.boarded).length;
  const bags = passengers.reduce((s,p)=>s+p.bags,0);
  const totalWeight = passengers.reduce((s,p)=>s+(p.bagTags||[]).reduce((x,t)=>x+t.weight,0),0);

  return `
  <div class="panel">
    <div class="panel-title">Passenger Manifest</div>
    <div class="panel-body">
    <div class="manifest-head">
      <div><b>${flight.flightNo}</b> · ${flight.from}-${flight.to} · ${flight.date}</div>
      <button class="btn secondary" onclick="printEl('manifest-print')">Print Manifest</button>
    </div>
    <div id="manifest-print" class="print-target">
      <div style="font-family:Arial;margin-bottom:8px;font-size:12px;">
        <b>${airlineNameFor(flight)}</b> — Flight ${flight.flightNo} — ${flight.fromCity} (${flight.from}) → ${flight.toCity} (${flight.to}) — ${flight.date} — STD ${flight.std} — Gate ${flight.gate}<br>
        Total Pax: ${total} &nbsp;|&nbsp; Boarded: ${boarded} &nbsp;|&nbsp; Total Bags: ${bags} &nbsp;|&nbsp; Total Weight: ${totalWeight.toFixed(1)}kg
      </div>
      <table>
        <thead><tr><th>SEQ</th><th>Passenger Name</th><th>PNR</th><th>ETKT</th><th>CL</th><th>Seat</th><th>Bags</th><th>Weight</th><th>Check-in</th><th>Board</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="10" class="empty">No passengers</td></tr>'}</tbody>
      </table>
    </div>
    </div>
  </div>
  `;
}

/* =====================================================================
   PRINT HELPER
===================================================================== */
function printEl(id){
  const el = document.getElementById(id);
  const isPass = el.querySelector('.pass, .bp-celebi, .bp-aeroflot, .bp-charter');
  const isBagtag = el.querySelector('.bagtag');
  const style = document.createElement('style');
  style.id = 'dynamic-print-style';

  // The .print-target CLASS exists on every passenger's hidden print block at
  // once (Check-In renders one per leg's boarding pass and one per bag tag,
  // for every passenger) — so the global ".print-target{visibility:visible}"
  // rule alone would reveal ALL of them together. Override it here so ONLY
  // the specific element the user clicked (matched by unique id) shows up.
  const visibilityRule = `
    @media print{
      .print-target, .print-target *{ visibility:hidden !important; }
      #${id}, #${id} *{ visibility:visible !important; }
      #${id}{ position:absolute !important; top:0; left:0; }
    }
  `;

  if(isPass || isBagtag){
    // Single fixed-size document (boarding pass / bag tag): measure its real
    // rendered size and scale it up to fill as much of one A4 sheet as
    // possible — in whichever orientation fits best — so it never spills
    // onto a second page and never prints tiny.
    const rect = el.getBoundingClientRect();
    const pxToMm = 25.4/96;
    const contentWmm = rect.width * pxToMm;
    const contentHmm = rect.height * pxToMm;

    const margin = 8; // mm, on each side
    const portraitAvailW = 210 - margin*2, portraitAvailH = 297 - margin*2;
    const landscapeAvailW = 297 - margin*2, landscapeAvailH = 210 - margin*2;

    const scalePortrait = Math.min(portraitAvailW/contentWmm, portraitAvailH/contentHmm);
    const scaleLandscape = Math.min(landscapeAvailW/contentWmm, landscapeAvailH/contentHmm);
    const useLandscape = scaleLandscape > scalePortrait;
    const scale = (useLandscape ? scaleLandscape : scalePortrait) * 0.98; // tiny safety margin

    style.innerHTML = `
      ${visibilityRule}
      @page{ size:A4 ${useLandscape?'landscape':'portrait'}; margin:${margin}mm; }
      #${id}.print-target{ transform:scale(${scale}); transform-origin:top left; }
    `;
  }else{
    // Variable-length content (e.g. the passenger manifest table): print it
    // plainly, letting it flow across as many A4 pages as it naturally needs —
    // no forced single-page shrink here.
    style.innerHTML = `
      ${visibilityRule}
      @page{ size:A4; margin:14mm; }
    `;
  }

  document.head.appendChild(style);
  el.classList.add('print-target');
  window.print();
  setTimeout(()=>{ document.getElementById('dynamic-print-style')?.remove(); }, 500);
}

/* clock */
function tickClock(){
  document.getElementById('clockNow').textContent = new Date().toUTCString().slice(0,25)+' UTC';
}
setInterval(tickClock,1000); tickClock();

loadState();
