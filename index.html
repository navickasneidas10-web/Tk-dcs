<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TK DCS — Departure Control System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/bwip-js/4.7.0/bwip-js-min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-dk:#0b2340;
  --navy:#123a63;
  --navy-lt:#1f5390;
  --panel:#dfe4ea;
  --panel-dk:#c7ced8;
  --field:#ffffff;
  --ink:#101820;
  --accent:#2f7dd1;
  --accent-dk:#1a5aa3;
  --ok:#1a7f37;
  --ok-bg:#d9f2df;
  --warn:#b5860a;
  --warn-bg:#fdf1d6;
  --err:#b3121b;
  --err-bg:#fbdfe0;
  --border:#8b96a4;
  --mono:'Consolas','Lucida Console',monospace;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#7d8896;color:var(--ink);font-size:13px;}

/* ===== TOP SYSTEM BAR ===== */
header.sysbar{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dk) 100%);
  color:#fff;padding:6px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:3px solid var(--accent);
}
header.sysbar .tag{background:#c8102e;color:#fff;font-weight:800;padding:3px 9px;border-radius:2px;font-size:12px;letter-spacing:.5px;}
header.sysbar .sysname{font-weight:700;font-size:13px;letter-spacing:.3px;}
header.sysbar .sysver{color:#9db3cf;font-size:11px;}
header.sysbar .spacer{flex:1;}
header.sysbar .clock{font-family:var(--mono);font-size:12px;color:#cfe0f5;}
header.sysbar .userbox{font-family:var(--mono);font-size:11px;background:#0006;padding:3px 8px;border-radius:2px;}

/* ===== TOAST (in-page notifications — no dependency on native alert/confirm) ===== */
#toastbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;max-width:92vw;}
.toast{
  background:#2a2a2a;color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:10px;margin-bottom:6px;
}
.toast.err{background:#7a1e24;}
.toast.ok{background:#1f5c34;}
.toast button{background:none;border:none;color:#fff;font-weight:800;cursor:pointer;font-size:14px;}

/* ===== FLIGHT BANNER ===== */
.flightbanner{
  background:repeating-linear-gradient(135deg,#1a3a5f,#1a3a5f 2px,#173252 2px,#173252 4px);
  color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;
  border-bottom:1px solid #0a1c30;font-family:var(--mono);
}
.flightbanner .fb-item{display:flex;flex-direction:column;line-height:1.25;}
.flightbanner .fb-item label{font-size:9px;color:#9fb8d6;text-transform:uppercase;letter-spacing:.6px;font-family:'Segoe UI',sans-serif;}
.flightbanner .fb-item span{font-size:14px;font-weight:700;}
.flightbanner select{
  background:#0b2340;color:#fff;border:1px solid #3a5f8a;font-family:var(--mono);font-size:12px;padding:4px 6px;border-radius:2px;
}

/* ===== LAYOUT: LEFT NAV + CONTENT ===== */
.shell{display:flex;min-height:calc(100vh - 108px);}
nav.modnav{
  width:168px;background:var(--panel-dk);border-right:1px solid var(--border);flex-shrink:0;
  display:flex;flex-direction:column;padding:6px 0;
}
nav.modnav button{
  background:none;border:none;text-align:left;padding:10px 14px;font-size:12.5px;font-weight:600;color:#243040;
  cursor:pointer;border-left:4px solid transparent;display:flex;align-items:center;gap:8px;
}
nav.modnav button .k{font-family:var(--mono);font-size:10px;background:#fff;border:1px solid var(--border);border-radius:2px;padding:1px 5px;color:#555;}
nav.modnav button.active{background:var(--panel);border-left-color:var(--accent);color:var(--navy-dk);}
nav.modnav button:hover{background:#eef1f5;}

main.content{flex:1;padding:16px;background:var(--panel);overflow-x:auto;}

.panel{background:#fff;border:1px solid var(--border);margin-bottom:14px;}
.panel .panel-title{
  background:linear-gradient(180deg,#eef2f6,#dde3ea);border-bottom:1px solid var(--border);
  padding:7px 12px;font-size:11.5px;font-weight:700;color:var(--navy-dk);text-transform:uppercase;letter-spacing:.5px;
}
.panel .panel-body{padding:14px;}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:#3a4553;text-transform:uppercase;letter-spacing:.3px;font-weight:600;}
.field input,.field select{
  padding:6px 8px;border:1px solid var(--border);border-radius:2px;font-size:12.5px;min-width:110px;font-family:var(--mono);
  background:var(--field);
}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;}

button.btn{
  background:linear-gradient(180deg,var(--accent),var(--accent-dk));color:#fff;border:1px solid #164a80;padding:7px 14px;
  border-radius:2px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.2px;
}
button.btn:hover{filter:brightness(1.08);}
button.btn.secondary{background:#fff;color:var(--navy-dk);border:1px solid var(--border);}
button.btn.secondary:hover{background:#eef1f5;}
button.btn:disabled{opacity:.4;cursor:not-allowed;}
button.btn.small{padding:4px 9px;font-size:11px;}
button.btn.danger{background:linear-gradient(180deg,#d1454d,#a3222a);border-color:#7a1319;}

table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono);}
table th{
  text-align:left;background:var(--navy);color:#fff;padding:7px 8px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.4px;font-family:'Segoe UI',sans-serif;font-weight:700;
}
table td{padding:6px 8px;border-bottom:1px solid #dde1e6;}
table tbody tr:nth-child(even){background:#f5f7f9;}
table tbody tr:hover{background:#eaf1fb;}

.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:10.5px;font-weight:800;letter-spacing:.3px;font-family:'Segoe UI',sans-serif;}
.badge.business{background:#2b2b2b;color:#f4d68b;}
.badge.premium{background:#dcd3b3;color:#5a4a1e;}
.badge.economy{background:#cfe0f5;color:#153a63;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.pending{background:var(--err-bg);color:var(--err);}
.badge.boarded{background:#d3e8ff;color:#0a5c9e;}

/* Seat map */
.seatmap{display:flex;flex-direction:column;gap:3px;max-height:380px;overflow-x:auto;overflow-y:auto;padding:10px;background:#0e2a4a;border-radius:3px;}
.seatrow{display:flex;align-items:center;gap:10px;flex-shrink:0;width:max-content;}
.seatrow .rownum{width:24px;font-size:10px;color:#9fb8d6;text-align:right;font-family:var(--mono);}
.seatgroup{display:flex;gap:3px;}
.seat{
  width:26px;height:26px;border-radius:2px;border:1px solid #3a5f8a;background:#1a3a5f;font-size:10px;font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#cfe0f5;flex-shrink:0;
}
.seat.taken{background:#0a1c30;color:#4a5f78;cursor:not-allowed;border-color:#22344a;}
.seat.selected{background:#c8102e;color:#fff;border-color:#7a0a1c;}
.seat.business{border-color:#c9a95a;}
.seat.premium{border-color:#c9b98a;}
.seat.economy{border-color:#5a8ac9;}
.seat.exitrow{box-shadow:0 0 0 2px #ffb020 inset;}
.seat-blank{width:26px;height:26px;}
.seatrow.exitrow{background:rgba(255,176,32,.08);border-radius:3px;}
.exit-tag{background:#ffb020;color:#1a1200;font-size:8px;font-weight:800;padding:1px 4px;border-radius:2px;letter-spacing:.3px;}
.gate-seat.exitrow{box-shadow:0 0 0 2px #ffb020 inset;}

.pax-list{display:flex;flex-direction:column;gap:8px;}
.pax-card{border:1px solid var(--border);border-radius:2px;padding:9px 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#f7f9fb;}
.pax-card .name{font-weight:700;min-width:190px;font-size:12.5px;align-self:center;font-family:var(--mono);}

/* ===== BOARDING PASS — replica of TK ATB stock (main coupon + agent stub) ===== */
.pass{
  width:203mm;height:76mm;background:#fdfdfb;position:relative;overflow:hidden;
  border:1px solid #bbb;color:#111;display:flex;
  font-family:'VT323','Share Tech Mono',monospace;
}
.pass .coupon{display:flex;flex-direction:column;position:relative;height:100%;}
.pass .coupon.main{width:75%;border-right:2px dashed #999;}
.pass .coupon.stub{width:25%;}
.pass .redhead{
  background:#c8102e;color:#fff;display:flex;align-items:center;gap:6px;padding:1.8mm 4mm;
  font-family:Arial,Helvetica,sans-serif;flex-shrink:0;
}
.pass .redhead .bird{width:22px;height:15px;flex-shrink:0;color:#fff;}
.pass .redhead .bird svg{width:100%;height:100%;display:block;}
.pass .redhead .brand{font-weight:800;font-size:10.5px;line-height:1.15;letter-spacing:.3px;}
.pass .redhead .divider{width:1px;align-self:stretch;background:rgba(255,255,255,.5);margin:0 2px;}
.pass .redhead .bp-label{font-size:9px;font-weight:700;letter-spacing:.3px;}
.pass .redhead .spacer{flex:1;}
.pass .redhead .star{font-size:7.5px;text-align:right;line-height:1.15;opacity:.95;}

.pass .body{flex:1;display:flex;position:relative;overflow:hidden;}
.pass .barcode-col{
  width:32mm;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:2mm 0;border-right:1px solid #ccc;overflow:hidden;
}
.pass .barcode-col canvas{width:28mm;height:96%;display:block;}
.pass .content{flex:1;padding:1.5mm 4mm;display:flex;flex-direction:column;gap:0.5mm;position:relative;}

.pass .stampband{
  position:absolute;top:1mm;right:6mm;font-family:'VT323',monospace;font-weight:700;font-size:21px;letter-spacing:2.5px;
  color:#111;opacity:.85;transform:rotate(-2deg);z-index:3;
}
.pass .toprow{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;margin-top:2mm;}
.pass .toprow .fqtv{font-size:14px;text-align:right;}
.pass .flightline{display:flex;gap:3mm;font-size:18px;margin-top:0.5mm;flex-wrap:wrap;align-items:baseline;}

.pass .bigfields{display:flex;gap:2.5mm;margin-top:1.5mm;}
.pass .bigfields .bf{border:1.4px solid #111;padding:1mm 2.5mm;text-align:center;flex:1;}
.pass .bigfields .bf b{display:block;font-size:8px;font-family:'VT323',monospace;color:#333;font-weight:700;letter-spacing:.2px;}
.pass .bigfields .bf span{font-size:32px;font-weight:700;font-family:'VT323',monospace;line-height:1.1;}

.pass .destcity{font-family:'VT323',monospace;font-weight:800;font-size:32px;margin-top:1mm;letter-spacing:.3px;line-height:1;text-align:center;}
.pass .ticketline{font-size:15px;font-weight:700;margin-top:auto;padding-top:1mm;}
.pass .secline{font-size:12px;color:#222;}
.pass .microtext{font-size:8.5px;color:#333;font-family:'VT323',monospace;margin-top:0.8mm;line-height:1.2;}

/* stub coupon specific */
.pass .stubtable{display:flex;flex-direction:column;gap:1.5mm;margin-top:1mm;}
.pass .stubtable label{display:block;font-size:7px;font-family:'VT323',monospace;color:#555;font-weight:700;letter-spacing:.2px;}
.pass .stubtable .val{font-size:16px;}
.pass .stub-headrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2mm;font-size:8px;font-family:'VT323',monospace;color:#555;font-weight:700;margin-top:2mm;border-bottom:1px solid #999;padding-bottom:1mm;}
.pass .stub-valrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2mm;font-size:14px;margin-top:1mm;}
.pass .stub-boxes{display:flex;gap:2mm;margin-top:2mm;}
.pass .stub-boxes .bf{border:1.4px solid #111;padding:1.2mm 2mm;text-align:center;flex:1;}
.pass .stub-boxes .bf b{display:block;font-size:7px;font-family:'VT323',monospace;color:#333;font-weight:700;}
.pass .stub-boxes .bf span{font-size:19px;font-weight:700;}
.pass .stub-footline{font-size:11px;font-weight:700;margin-top:auto;padding-top:1mm;}
.pass .stub-star{position:absolute;bottom:2mm;right:4mm;font-size:7px;text-align:right;font-family:'VT323',monospace;color:#777;line-height:1.3;}

/* qrbox removed — single real PDF417 barcode is now the only machine-readable code */

/* ===== Style modifiers for the alternate airlines (reuse the exact same
   203mm x 76mm .pass shell/sizing as Turkish — only colors/text differ) ===== */
.redhead.rh-celebi{background:linear-gradient(90deg,#00A19C,#00699E);}

/* Çelebi exact layout: blue labels (normal font) above black values (pixelated font) */
.cel-label{font-family:Arial,Helvetica,sans-serif;color:#00699E;font-size:7px;font-weight:700;letter-spacing:.2px;line-height:1.3;}
.cel-value{font-family:'VT323',monospace;color:#111;font-size:19px;line-height:1.05;}
.pass .content.cel-content{padding-top:2.5mm;}
.cel-row{margin-top:1.5mm;}
.cel-row2{display:flex;gap:6mm;margin-top:2mm;}
.cel-row2>div{flex:1;}
.cel-grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border:1px solid #00A19C;margin-top:2.5mm;}
.cel-grid4>div{padding:1mm 2mm;border-right:1px solid #00A19C;}
.cel-grid4>div:last-child{border-right:none;}
.cel-bottomrow{display:flex;gap:5mm;margin-top:3mm;align-items:center;}
.cel-barcode-inline{flex:1;display:flex;align-items:center;justify-content:flex-start;height:22mm;overflow:hidden;}
.cel-barcode-inline canvas{max-width:100%;max-height:100%;}
.cel-sidelist{display:flex;flex-direction:column;gap:1.5mm;width:34mm;flex-shrink:0;}
.cel-sidelist>div{display:flex;justify-content:space-between;align-items:baseline;gap:2mm;border-bottom:1px solid #cde;padding-bottom:0.8mm;}
.cel-sidelist .cel-value{font-size:17px;}
.cel-microtext{font-family:Arial,Helvetica,sans-serif;color:#00699E;font-size:7px;text-align:center;margin-top:2.5mm;}
.cel-stub-narrow .cel-label{font-size:6.5px;}
.cel-stub-narrow .cel-value{font-size:14px;}
.cel-stub-narrow .cel-row2{gap:3mm;}
.redhead.rh-aeroflot{background:#003876;}

/* ===== AEROFLOT — built from scratch, matching the real ticket field-for-field
   (not reusing the Turkish shell's internal classes; only .pass/.coupon are
   shared, purely for the official 203x76mm envelope size). ===== */
.af2-wrap{
  width:100%;height:100%;box-sizing:border-box;padding:2.5mm 4mm;display:flex;flex-direction:column;
  font-family:'VT323',monospace;color:#111;position:relative;overflow:hidden;
}
.af2-topline{display:flex;justify-content:space-between;align-items:flex-start;}
.af2-title{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:12px;color:#003876;line-height:1.35;}
.af2-issuedby{text-align:right;}
.af2-issuedby-label{font-family:Arial,Helvetica,sans-serif;font-size:6px;color:#555;letter-spacing:.2px;}
.af2-logo{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:17px;color:#003876;margin-top:0.5mm;}
.af2-logo small{display:block;font-weight:400;font-style:italic;font-size:6.5px;color:#888;}
.af2-sky{font-family:Arial,Helvetica,sans-serif;font-size:6px;color:#555;margin-top:0.5mm;}

.af2-field{margin-top:1.6mm;}
.af2-field label{font-family:Arial,Helvetica,sans-serif;font-size:8px;color:#003876;font-weight:700;display:block;letter-spacing:.2px;}
.af2-field span{font-size:19px;line-height:1.05;}

.af2-row2{display:flex;gap:6mm;margin-top:1.6mm;}
.af2-row2>div{flex:1;}

.af2-issagt{margin-top:1.6mm;}
.af2-issagt label{font-family:Arial,Helvetica,sans-serif;font-size:6.5px;color:#003876;font-weight:700;display:block;}
.af2-issagt span{font-size:20px;font-weight:700;}

.af2-row3{display:flex;gap:4mm;margin-top:1.8mm;}
.af2-row3>div{flex:1;min-width:0;}
.af2-row3 label{font-family:Arial,Helvetica,sans-serif;font-size:7px;color:#003876;font-weight:700;display:block;}
.af2-row3 span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}

.af2-bottomrow{display:flex;gap:4mm;margin-top:2.5mm;align-items:center;}
.af2-barcode{flex:1;height:14mm;display:flex;align-items:center;overflow:hidden;}
.af2-barcode canvas{max-width:100%;max-height:100%;}
.af2-bigfields{display:flex;gap:2mm;flex-shrink:0;}
.af2-bf{border:1.2px solid #003876;padding:0.8mm 2mm;text-align:center;}
.af2-bf label{font-family:Arial,Helvetica,sans-serif;font-size:7px;color:#003876;display:block;}
.af2-bf span{font-size:21px;font-weight:700;}

.af2-refs2{display:flex;justify-content:space-between;gap:2mm;font-family:Arial,Helvetica,sans-serif;font-size:8px;color:#333;margin-top:2mm;}
.af2-codeshare{font-family:'VT323',monospace;font-size:16px;color:#111;margin-top:1.5mm;}
.af2-footer{font-family:Arial,Helvetica,sans-serif;font-size:8px;color:#003876;text-align:center;margin-top:2mm;line-height:1.35;}
.af2-bottomcode{font-size:13px;font-weight:700;margin-top:auto;padding-top:1mm;}

.af2-stub-wrap .af2-field span,.af2-stub-wrap .af2-row3 span{font-size:12px;}
.af2-stub-wrap .af2-row3{gap:2.5mm;}

/* Aeroflot exact layout: bilingual EN/RU label above value, horizontal (not rotated) barcode inline with big fields */
.pass .content.af-content{padding-top:2.5mm;}
.af-row{margin-top:1.5mm;}
.af-row label,.af-row2 label,.af-row3 label{font-family:Arial,Helvetica,sans-serif;color:#003876;font-size:7px;font-weight:700;display:block;line-height:1.3;}
.af-row span,.af-row2 span,.af-row3 span{font-family:'VT323',monospace;color:#111;font-size:18px;line-height:1.05;}
.af-row2{display:flex;gap:6mm;margin-top:2mm;}
.af-row2>div{flex:1;}
.af-row3{display:flex;gap:5mm;margin-top:2mm;}
.af-row3>div{flex:1;}
.af-bottomrow{display:flex;gap:5mm;margin-top:2.5mm;align-items:center;}
.af-barcode-inline{flex:1;display:flex;align-items:center;justify-content:flex-start;height:15mm;overflow:hidden;}
.af-barcode-inline canvas{max-width:100%;max-height:100%;}
.af-big{display:flex;gap:2.5mm;flex-shrink:0;}
.af-bf{border:1.4px solid #003876;padding:1mm 2mm;text-align:center;}
.af-bf b{display:block;font-family:Arial,sans-serif;font-size:6.5px;color:#003876;}
.af-bf span{font-family:'VT323',monospace;font-size:20px;font-weight:700;color:#111;}
.af-refs{display:flex;justify-content:space-between;gap:2mm;flex-wrap:wrap;font-family:Arial,sans-serif;font-size:8px;color:#333;margin-top:2mm;}
.af-footer{font-family:Arial,sans-serif;font-size:7px;color:#003876;text-align:center;margin-top:2mm;line-height:1.4;}
.af-stub-content .af-row2,.af-stub-content .af-row3{gap:3mm;}
.af-stub-content .af-row label,.af-stub-content .af-row2 label,.af-stub-content .af-row3 label{font-size:6px;}
.af-stub-content .af-row span,.af-stub-content .af-row2 span,.af-stub-content .af-row3 span{font-size:14px;}
.redhead.rh-charter{background:#eee;color:#111;border-bottom:2px solid #111;}
.redhead.rh-charter .bp-label,.redhead.rh-charter .brand,.redhead.rh-charter .star{color:#111;}
.redhead.rh-charter .divider{background:rgba(0,0,0,.3);}

/* Charter exact layout: label:value rows in two columns (plain, no branding) */
.pass .content.ch-content{position:relative;padding-top:3mm;}
.ch-cols{display:flex;gap:8mm;margin-top:4mm;}
.ch-left{flex:1.3;min-width:0;display:flex;flex-direction:column;gap:3.1mm;}
.ch-lrow{display:flex;gap:2mm;font-size:14px;align-items:baseline;}
.ch-lrow label{width:27mm;flex-shrink:0;}
.ch-lrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-right{display:flex;flex-direction:column;gap:2.8mm;padding-top:1mm;}
.ch-rrow{display:flex;gap:3mm;align-items:baseline;font-size:14px;}
.ch-rrow.ch-rrow-pnr span{font-size:18px;font-weight:700;}
.ch-rrow label{width:26mm;flex-shrink:0;}
.ch-rrow span{font-size:32px;font-weight:700;}
.ch-stub-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2mm;font-size:13px;}
.ch-stub-val3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2mm;font-size:19px;}
.ch-stub-block .ch-stub-val3{margin-top:1mm;}
.ch-stub-seat{font-size:32px;font-weight:800;text-align:center;}
.ch-stub-narrow .ch-lrow{font-size:15px;gap:2mm;}

  turkish:"TURKISH AIRLINES", aeroflot:"AEROFLOT", charter:"CHARTER AIRLINES", celebi:"ÇELEBİ GROUND HANDLING"

function airlineNameFor(f){ return (f && f.airlineName) || STYLE_DEFAULT_AIRLINE_NAME[f?f.bpStyle:'turkish'] || AIRLINE.name; }
function operatingAirlineFor(f){ return (f && f.operatingAirline) || airlineNameFor(f); }

  if(airlineInput && !airlineInput.value.trim()){ airlineInput.placeholder = STYLE_DEFAULT_AIRLINE_NAME[style] || 'TURKISH AIRLINES'; }
}

const BIRD_SVG = `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
  <path fill="currentColor" d="M60 8 C61 22, 61 30, 60 40 L60 8 Z"/>
  <path fill="currentColor" d="M60 24 C50 10, 28 4, 4 20 C24 20, 40 26, 52 40 C38 38, 20 40, 2 52 C26 48, 44 50, 56 62 L60 68 L64 62 C76 50, 94 48, 118 52 C100 40, 82 38, 68 40 C80 26, 96 20, 116 20 C92 4, 70 10, 60 24 Z"/>
</svg>`;

const AIRCRAFT_PRESETS = {
  "Narrowbody (A321)": {
    business: { rows:[1,2,3], groups:[["A","C"],["D","F"]] },
    premium: null,
    economy: { rows:range(4,30), groups:[["A","B","C"],["D","E","F"]] }
  },
  "Widebody (B777-300ER)": {
    business: { rows:[1,2,3,4], groups:[["A"],["C","D"],["G","H"],["K"]] },
    premium: { rows:range(10,14), groups:[["A","C"],["D","E","F","G"],["H","K"]] },
    economy: { rows:range(20,46), groups:[["A","B","C"],["D","E","F","G"],["H","J","K"]] }
  }
};

function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}

function parseGroups(pattern){
  // "AC|DFG|HK" -> [["A","C"],["D","F","G"],["H","K"]]
  return pattern.split('|').map(g=>g.trim().split('').filter(ch=>/[A-Z]/i.test(ch)).map(ch=>ch.toUpperCase())).filter(g=>g.length>0);
}
function groupsToPattern(groups){
  return groups.map(g=>g.join('')).join('|');
}

function getAircraftByReg(reg){
  return STATE.aircraftRegistry.find(a=>a.reg===reg);
}

/* Normalizes a class definition into an array of {row, groups} entries,
   regardless of whether it was stored the old way (rows:[...], groups:[[...]])
   or the new way (array of per-row definitions, allowing irregular layouts). */
function normalizeAcClass(clsDef){
  if(!clsDef) return [];
  if(Array.isArray(clsDef)) return clsDef;
  return (clsDef.rows||[]).map(r=>({ row:r, groups: clsDef.groups }));
}
function classRowDefs(ac, cls){
  return normalizeAcClass(ac.classes[cls]).slice().sort((a,b)=>a.row-b.row);
}

function classSeatCapacity(ac, cls){
  return classRowDefs(ac, cls).reduce((sum,rd)=>sum+rd.groups.reduce((s,g)=>s+g.length,0), 0);
}
function classBookedCount(flightId, cls, excludePnr){
  return STATE.bookings.reduce((count,b)=>{
    if(excludePnr && b.pnr===excludePnr) return count;
    if(!b.legs.includes(flightId)) return count;
    return count + b.passengers.filter(p=>p.cls===cls).length;
  }, 0);
}

/* All seat letters used anywhere on this aircraft, in canonical left-to-right
   order (I and O skipped, as is standard). Used so every row — even rows from
   a different class with a different seat count/layout — lines its seat
   letters up in the same fixed columns instead of drifting out of alignment. */
function getMasterLetters(ac){
  const set = new Set();
  ['business','premium','economy'].forEach(cls=>{
    classRowDefs(ac,cls).forEach(rd=> rd.groups.forEach(g=> g.forEach(l=>set.add(l))));
  });
  const order = 'ABCDEFGHJKLMNPQRSTUVWXYZ'.split('');
  return order.filter(l=>set.has(l));
}
/* Which master-column letters should get a small visual gap before them
   (an aisle), based on the widest/most representative cabin on this aircraft. */
function getAisleBeforeSet(ac){
  const preference = ['economy','premium','business'];
  for(const cls of preference){
    const rowDefs = classRowDefs(ac, cls);
    if(rowDefs.length){
      const s = new Set();
      rowDefs[0].groups.forEach((g,i)=>{ if(i>0) s.add(g[0]); });
      return s;
    }
  }
  return new Set();
}

function buildSeatList(tailNumber){
  const ac = getAircraftByReg(tailNumber);
  if(!ac) return [];
  const seats = [];
  ["business","premium","economy"].forEach(cls=>{
    classRowDefs(ac,cls).forEach(rd=>{
      rd.groups.forEach(g=> g.forEach(letter=>{
        seats.push({ id:rd.row+letter, row:rd.row, letter, cls });
      }));
    });
  });
  return seats;
}

function classLabel(cls){
  return cls==='business' ? 'BUSINESS' : cls==='premium' ? 'PREMIUM ECONOMY' : 'ECONOMY';
}
function classCodeLetter(cls){
  return cls==='business' ? 'C' : cls==='premium' ? 'W' : 'Y';
}

/* ---------- persistent state ---------- */
let STATE = {
  flights: [],
  bookings: [],
  aircraftRegistry: [],
  seqCounters: {},
  bagCounters: {},
  eTicketCounter: 0,
  selection: { flightId:null, pnr:null, passengerKey:null, seatLegId:null }
};

let applyingRemoteUpdate = false; // guards against re-broadcasting a change we just received
let pushInFlight = false;
let pushQueuedAgain = false;
let pushDebounceTimer = null;

async function loadState(){
  // 1) fast local cache first, so the UI has something to show immediately
  try{
    const raw = localStorage.getItem('tkdcs-state-en');
    if(raw){ STATE = JSON.parse(raw); }
  }catch(e){ console.error('local load error', e); }

  // 2) if Supabase is configured, pull the shared copy (source of truth) and subscribe to live changes
  if(sbClient){
    let loaded = false;
    for(let attempt=0; attempt<2 && !loaded; attempt++){
      try{
        const { data, error } = await sbClient.from('tkdcs_state').select('data').eq('id', SUPABASE_ROW_ID).maybeSingle();
        if(error) throw error;
        if(data && data.data){ STATE = data.data; }
        loaded = true;
        subscribeToRemoteChanges();
      }catch(e){
        console.error('supabase load error', e);
        if(attempt===0){ await new Promise(r=>setTimeout(r,1500)); } // one quick retry before giving up
      }
    }
    if(!loaded) notify('Could not reach the shared database — showing this device\'s local copy. Changes made now may not sync until connection is restored.', 'err');
  }

  if(!STATE.aircraftRegistry) STATE.aircraftRegistry = [];
  if(!STATE.__rev) STATE.__rev = 0;
  if(!STATE.eTicketCounter) STATE.eTicketCounter = 0;
  if(STATE.flights.length===0) seedDemoData();
  // migration: assign an e-ticket number to any passenger created before this feature existed
  STATE.flights.forEach(f=>{ if(f.archived===undefined) f.archived=false; if(!f.bpStyle) f.bpStyle='turkish'; if(f.airlineName===undefined) f.airlineName=''; if(f.operatingAirline===undefined) f.operatingAirline=''; if(f.terminal===undefined) f.terminal=''; if(!f.bagAllowance) f.bagAllowance={economy:20,premium:25,business:30}; });
  let migrated = false;
  STATE.bookings.forEach(b=>{
    b.passengers.forEach(p=>{ if(!p.eTicket){ p.eTicket = genETicket(); migrated = true; } });
  });
  if(migrated) saveState();
  render();
}

function saveState(){
  // bump a revision counter so late-arriving/out-of-order network responses
  // can never clobber newer local state (see subscribeToRemoteChanges below)
  STATE.__rev = (STATE.__rev||0) + 1;

  // local cache: instant, always works even if offline or Supabase isn't configured
  try{ localStorage.setItem('tkdcs-state-en', JSON.stringify(STATE)); }
  catch(e){ console.error('local storage error', e); }

  if(!sbClient || applyingRemoteUpdate) return;

  // debounce rapid-fire edits, then push through a single serialized channel —
  // never more than one upsert in flight, so responses can't complete out of order
  clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(pushToSupabase, 350);
}

async function pushToSupabase(){
  if(pushInFlight){ pushQueuedAgain = true; return; }
  pushInFlight = true;
  const snapshot = STATE; // read fresh at send time, not at the moment saveState() was first called
  try{
    const { error } = await sbClient.from('tkdcs_state')
      .upsert({ id: SUPABASE_ROW_ID, data: snapshot, updated_at: new Date().toISOString() });
    if(error){ console.error('supabase save error', error); notify('Change saved locally, but syncing to the shared database failed.', 'err'); }
  }catch(e){
    console.error('supabase save exception', e);
  }
  pushInFlight = false;
  if(pushQueuedAgain){ pushQueuedAgain = false; pushToSupabase(); }
}

let remoteChannel = null;
function subscribeToRemoteChanges(){
  if(!sbClient || remoteChannel) return;
  remoteChannel = sbClient.channel('tkdcs-state-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'tkdcs_state', filter:`id=eq.${SUPABASE_ROW_ID}` }, (payload)=>{
      if(payload.new && payload.new.data){
        const incomingRev = payload.new.data.__rev || 0;
        const currentRev = STATE.__rev || 0;
        if(incomingRev < currentRev) return; // stale/out-of-order message — ignore, we already have something newer
        applyingRemoteUpdate = true;
        STATE = payload.new.data;
        try{ localStorage.setItem('tkdcs-state-en', JSON.stringify(STATE)); }catch(e){}
        render();
        applyingRemoteUpdate = false;
      }
    })
    .subscribe();
}

/* =====================================================================
   NAVIGATION / RENDER
===================================================================== */
const TABS = [
  {id:"flights", label:"Flight Setup", key:"F1"},
  {id:"aircraft", label:"Aircraft Registry", key:"F2"},
  {id:"checkin", label:"Check-In", key:"F3"},
  {id:"pass", label:"Boarding Pass", key:"F4"},

let activeTab = "flights";

function setTab(id){ activeTab=id; render(); }

function render(){
  const nav = document.getElementById('modnav');
  nav.innerHTML = TABS.map(t=>`<button class="${t.id===activeTab?'active':''}" onclick="setTab('${t.id}')"><span class="k">${t.key}</span> ${t.label}</button>`).join('');

  renderFlightBanner();

  const main = document.getElementById('main');
  if(activeTab==="flights") main.innerHTML = renderFlights();
  if(activeTab==="aircraft") main.innerHTML = renderAircraft();

let pnrDraft = newPnrDraft();
function flightRefFor(flight){
  // always include the date — unambiguous, and shows the correct @date syntax up front
  return `${flight.flightNo}@${flight.date}`;
}

function bulkTemplateRows(){
  let rows = '';
  if(STATE.flights.length>0){
    const f1 = STATE.flights[0];
    const ref1 = flightRefFor(f1);
    rows += `ABC123,${ref1},,,MR,YILDIRIM,MUSTAFA,1985-05-10,L1234567,TUR,2030-01-01,economy\n`;
    rows += `ABC123,${ref1},,,MRS,YILDIRIM,AYSE,1987-03-22,L7654321,TUR,2029-06-15,economy\n`;
    if(STATE.flights.length>1){
      const f2 = STATE.flights[1];
      const ref2 = flightRefFor(f2);
      rows += `XYZ789,${ref1},${ref2},,MR,SMITH,JOHN,1990-01-01,P9988776,USA,2031-12-31,business\n`;
    }else{
      rows += `XYZ789,${ref1},,,MR,SMITH,JOHN,1990-01-01,P9988776,USA,2031-12-31,business\n`;
    }
  }else{
    rows += `ABC123,TK0186@2026-07-13,,,MR,YILDIRIM,MUSTAFA,1985-05-10,L1234567,TUR,2030-01-01,economy\n`;
    rows += `ABC123,TK0186@2026-07-13,,,MRS,YILDIRIM,AYSE,1987-03-22,L7654321,TUR,2029-06-15,economy\n`;
    rows += `XYZ789,TK0186@2026-07-13,TK1836@2026-07-13,,MR,SMITH,JOHN,1990-01-01,P9988776,USA,2031-12-31,business\n`;
  }
  return rows;
}

function downloadBulkTemplate(){
  const header = "PNR,LEG1_FLIGHTNO,LEG2_FLIGHTNO,LEG3_FLIGHTNO,TITLE,SURNAME,GIVEN,DOB,PASSPORT,NATIONALITY,EXPIRY,CLASS,SEAT1,SEAT2,SEAT3\n";
  const csv = header + bulkTemplateRows();
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pnr_bulk_import_template.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function findFlightByRef(ref){
  if(!ref) return null;
  const [noPart, datePart] = ref.split('@').map(s=>s && s.trim());
  const matches = STATE.flights.filter(fl=>fl.flightNo.toUpperCase()===noPart.toUpperCase());
  if(matches.length===0) return null;
  if(matches.length===1) return matches[0]; // unambiguous, date not needed
  if(!datePart) return null; // ambiguous (same flight no. on multiple dates) and no date given to disambiguate
  return matches.find(fl=>fl.date===datePart) || null;
}

function parseBulkImportPNRs(){
  const raw = document.getElementById('bulk-import-text').value.trim();
  if(!raw) return notify('Paste CSV data first.');
  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length===0) return notify('No data found.');
  const delim = lines[0].includes(';') ? ';' : ',';
  let startIdx = 0;
  if(/^pnr$/i.test((lines[0].split(delim)[0]||'').trim())) startIdx = 1;

  const grouped = {}; // pnr -> { legRefs:[...], rows:[...] }
  const errors = [];
  for(let i=startIdx;i<lines.length;i++){
    const cols = lines[i].split(delim).map(c=>c.trim());
    if(cols.length<7){ errors.push(`Line ${i+1}: not enough columns`); continue; }
    const [pnrRaw, leg1no, leg2no, leg3no, title, surname, given, dob, passport, nationality, expiry, cls, seat1, seat2, seat3] = cols;
    if(!surname){ errors.push(`Line ${i+1}: missing surname`); continue; }
    if(!leg1no && (leg2no || leg3no)){ errors.push(`Line ${i+1}: LEG1 is empty but LEG2/LEG3 has a value — fill LEG1 first, skipped`); continue; }
    const pnr = (pnrRaw || genPNR()).toUpperCase();
    if(!grouped[pnr]) grouped[pnr] = { legRefs:[leg1no,leg2no,leg3no].filter(Boolean), rows:[] };
    grouped[pnr].rows.push({
      title:(title||'MR').toUpperCase(), surname:surname.toUpperCase(), given:(given||'GIVENNAME').toUpperCase(),
      dob:dob||'', passport:(passport||'').toUpperCase(), nationality:(nationality||'').toUpperCase(),
      expiry:expiry||'', cls:(cls||'economy').toLowerCase().trim(),
      seats:{ 1:(seat1||'').toUpperCase().trim()||null, 2:(seat2||'').toUpperCase().trim()||null, 3:(seat3||'').toUpperCase().trim()||null }
    });
  }

  let importedPnrCount=0, importedPaxCount=0;
  Object.keys(grouped).forEach(pnr=>{
    if(STATE.bookings.some(b=>b.pnr===pnr)){ errors.push(`PNR ${pnr}: already exists, skipped`); return; }
    const group = grouped[pnr];
    const resolvedFlights = group.legRefs.map(ref=>findFlightByRef(ref));
    if(resolvedFlights.length===0 || resolvedFlights.some(f=>!f)){
      const ambiguous = group.legRefs.some(ref=>{
        const no = ref.split('@')[0].trim();
        return STATE.flights.filter(fl=>fl.flightNo.toUpperCase()===no.toUpperCase()).length>1 && !ref.includes('@');
      });
      errors.push(`PNR ${pnr}: ${ambiguous ? 'flight number matches more than one date — add @YYYY-MM-DD to disambiguate' : 'unknown flight number(s)'}, skipped`);
      return;
    }
    const todayISO = new Date().toISOString().slice(0,10);
    if(resolvedFlights.some(f=>f.date<todayISO || f.archived)){
      errors.push(`PNR ${pnr}: one or more legs is a past/archived flight — a PNR cannot be created on it, skipped`);
      return;
    }
    const legIds = resolvedFlights.map(f=>f.id);

    // check seat capacity per leg, per class, before importing this PNR's passengers
    const newByClass = {};
    group.rows.forEach(r=>{
      const rc = ['economy','premium','business'].includes(r.cls) ? r.cls : 'economy';
      newByClass[rc] = (newByClass[rc]||0)+1;
    });
    let capacityFail = null;
    for(const legFlight of resolvedFlights){
      const ac = getAircraftByReg(legFlight.tailNumber);
      if(!ac) continue;
      for(const rc of Object.keys(newByClass)){
        const capacity = classSeatCapacity(ac, rc);
        const already = classBookedCount(legFlight.id, rc);
        if(already + newByClass[rc] > capacity){
          capacityFail = `PNR ${pnr}: not enough ${classLabel(rc)} seats on ${legFlight.flightNo} (only ${Math.max(0,capacity-already)} remaining, needs ${newByClass[rc]}), skipped`;
          break;
        }
      }
      if(capacityFail) break;
    }
    if(capacityFail){ errors.push(capacityFail); return; }

    // optional seat pre-assignment, per leg: validate no duplicates within this PNR and no clashes with already-booked seats
    let seatFail = null;
    for(let legNum=1; legNum<=legIds.length; legNum++){
      const legId = legIds[legNum-1];
      const requestedSeats = group.rows.map(r=>r.seats[legNum]||null);
      const seatCounts = {};
      requestedSeats.forEach(s=>{ if(s) seatCounts[s]=(seatCounts[s]||0)+1; });
      const dupSeat = Object.keys(seatCounts).find(s=>seatCounts[s]>1);
      if(dupSeat){ seatFail = `PNR ${pnr}: seat ${dupSeat} requested for more than one passenger on Leg ${legNum}, skipped`; break; }
      const takenSeats = new Set();
      STATE.bookings.filter(b=>b.legs.includes(legId)).forEach(b=>b.passengers.forEach(p=>{ const s=p.legs[legId]?.seat; if(s) takenSeats.add(s); }));
      const clashSeat = requestedSeats.find(s=>s && takenSeats.has(s));
      if(clashSeat){ seatFail = `PNR ${pnr}: seat ${clashSeat} is already taken on ${resolvedFlights[legNum-1].flightNo} (Leg ${legNum}), skipped`; break; }
    }
    if(seatFail){ errors.push(seatFail); return; }

    const legsState = {};
    legIds.forEach(fid=>{ legsState[fid] = { seat:null, checkedIn:false, seq:null, boarded:false }; });
    const passengers = group.rows.map(r=>{
      const legsClone = JSON.parse(JSON.stringify(legsState));
      legIds.forEach((legId,idx)=>{
        const legNum = idx+1;
        if(r.seats[legNum]) legsClone[legId].seat = r.seats[legNum];
      });
      return {
        key:'p'+Date.now()+Math.random().toString(36).slice(2,6),
        title:r.title, surname:r.surname, given:r.given, dob:r.dob,
        passportNumber:r.passport, nationality:r.nationality, passportExpiry:r.expiry,
        cls:['economy','premium','business'].includes(r.cls) ? r.cls : 'economy', group:'-', eTicket: genETicket(),
        legs: legsClone, bags:0, bagWeights:[], bagTags:[]
      };
    });
    STATE.bookings.push({ pnr, legs:legIds, passengers });
    importedPnrCount++; importedPaxCount += passengers.length;
  });

  saveState(); render();
  let msg = `Imported ${importedPnrCount} PNR(s), ${importedPaxCount} passenger(s).`;
  if(errors.length) msg += ` ${errors.length} issue(s): ${errors.slice(0,3).join('; ')}${errors.length>3?'…':''}`;
  notify(msg, errors.length && importedPnrCount===0 ? 'err' : 'ok');
}

function renderDraftSeatPickerPanel(){
  if(!draftSeatPicker) return '';
  const { rowIndex, legNum } = draftSeatPicker;
  const flightId = [pnrDraft.leg1,pnrDraft.leg2,pnrDraft.leg3][legNum-1];
  const flight = STATE.flights.find(f=>f.id===flightId);
  if(!flight) return '';
  const ac = getAircraftByReg(flight.tailNumber);
  if(!ac) return `<div class="panel"><div class="panel-body empty">This flight has no registered aircraft/cabin layout — cannot pick a seat.</div></div>`;

  // seats already taken by real bookings on this flight...
  const takenIds = new Set();
  STATE.bookings.filter(b=>b.legs.includes(flightId)).forEach(b=>b.passengers.forEach(p=>{ const s=p.legs[flightId]?.seat; if(s) takenIds.add(s); }));
  // ...plus seats already picked by OTHER rows in this same draft for this same leg
  pnrDraft.rows.forEach((r,i)=>{ if(i!==rowIndex && r.seats[legNum]) takenIds.add(r.seats[legNum]); });
  const curSeat = pnrDraft.rows[rowIndex].seats[legNum] || null;

  const masterLetters = getMasterLetters(ac);
  const aisleBefore = getAisleBeforeSet(ac);
  const gridCols = `24px repeat(${masterLetters.length}, 26px) auto`;

  let mapHtml = '<div class="seatmap">';
  ['business','premium','economy'].forEach(cls=>{
    classRowDefs(ac, cls).forEach(rd=>{
      const rowNum = rd.row;
      const rowLetters = new Set();
      rd.groups.forEach(g=>g.forEach(l=>rowLetters.add(l)));
      mapHtml += `<div class="seatrow ${rd.exitRow?'exitrow':''}" style="display:grid;grid-template-columns:${gridCols};align-items:center;gap:3px;">`;
      mapHtml += `<div class="rownum">${rowNum}${rd.exitRow?' <span class="exit-tag" title="Emergency Exit Row">EXIT</span>':''}</div>`;
      masterLetters.forEach(letter=>{
        const gapStyle = aisleBefore.has(letter) ? 'margin-left:8px;' : '';
        if(rowLetters.has(letter)){
          const id = rowNum+letter;
          const isTaken = takenIds.has(id) && curSeat!==id;
          const isSelected = curSeat===id;
          mapHtml += `<div class="seat ${cls} ${rd.exitRow?'exitrow':''} ${isTaken?'taken':''} ${isSelected?'selected':''}" style="${gapStyle}" ${isTaken?'':`onclick="pickDraftSeat('${id}','${cls}')"`}>${letter}</div>`;
        }else{
          mapHtml += `<div class="seat-blank" style="${gapStyle}"></div>`;
        }
      });
      mapHtml += `<span class="badge ${cls}" style="margin-left:8px;justify-self:start;width:fit-content;">${classLabel(cls)}</span></div>`;
    });
  });
  mapHtml += '</div>';

  return `
  <div class="panel">
    <div class="panel-title">Pick a Seat — ${flight.flightNo} ${flight.from}-${flight.to} (Leg ${legNum})<span style="float:right"><button class="btn small secondary" onclick="closeDraftSeatPicker()">✕ Close</button></span></div>
    <div class="panel-body">

    </div>
  </div>`;
}

function submitCreatePnr(){
  const legIds = [pnrDraft.leg1,pnrDraft.leg2,pnrDraft.leg3].filter(Boolean);
  if(legIds.length===0) return notify('Select at least Flight Leg 1.');
  const todayISO = new Date().toISOString().slice(0,10);
  const legFlights = legIds.map(id=>STATE.flights.find(fl=>fl.id===id));
  if(legFlights.some(fl=>!fl || fl.date<todayISO || fl.archived)) return notify('One or more selected legs is a past or archived flight — a PNR cannot be created on it.');
  const pnr = (pnrDraft.pnr||genPNR()).toUpperCase();
  if(STATE.bookings.some(b=>b.pnr===pnr)) return notify('This PNR already exists — regenerate or choose a different one.');
  const validRows = pnrDraft.rows.filter(r=>r.surname.trim());
  if(validRows.length===0) return notify('Add at least one passenger with a surname.');

  // check seat capacity per leg, per class, before creating the booking
  const newByClass = {};
  validRows.forEach(r=>{ newByClass[r.cls] = (newByClass[r.cls]||0)+1; });
  for(const legFlight of legFlights){
    const ac = getAircraftByReg(legFlight.tailNumber);
    if(!ac) continue; // no aircraft on this flight — can't check capacity, allow through
    for(const cls of Object.keys(newByClass)){
      const capacity = classSeatCapacity(ac, cls);
      const already = classBookedCount(legFlight.id, cls);
      const remaining = capacity - already;
      if(newByClass[cls] > remaining){
        return notify(`Not enough ${classLabel(cls)} seats on ${legFlight.flightNo} (${legFlight.from}-${legFlight.to}): only ${Math.max(0,remaining)} remaining, but this PNR needs ${newByClass[cls]}.`);
      }
    }
  }

  // validate optional seat requests, per leg: no duplicates within this PNR for that leg, none already taken
  for(let legNum=1; legNum<=legIds.length; legNum++){
    const legId = legIds[legNum-1];
    const legFlight = legFlights[legNum-1];
    const requestedSeats = validRows.map(r=> r.seats && r.seats[legNum] ? r.seats[legNum] : null);
    const seatCounts = {};
    requestedSeats.forEach(s=>{ if(s) seatCounts[s]=(seatCounts[s]||0)+1; });
    const dupSeat = Object.keys(seatCounts).find(s=>seatCounts[s]>1);
    if(dupSeat) return notify(`Seat ${dupSeat} was requested for more than one passenger on Leg ${legNum} (${legFlight.flightNo}).`);
    const takenSeats = new Set();
    STATE.bookings.filter(b=>b.legs.includes(legId)).forEach(b=>b.passengers.forEach(p=>{ const s=p.legs[legId]?.seat; if(s) takenSeats.add(s); }));
    for(const s of requestedSeats){
      if(s && takenSeats.has(s)) return notify(`Seat ${s} is already taken on ${legFlight.flightNo} (${legFlight.from}-${legFlight.to}), Leg ${legNum}.`);
    }
  }

  const legsState = {};
  legIds.forEach(id=>{ legsState[id] = { seat:null, checkedIn:false, seq:null, boarded:false }; });

  const passengers = validRows.map(r=>{
    const legsClone = JSON.parse(JSON.stringify(legsState));
    legIds.forEach((legId,idx)=>{
      const legNum = idx+1;
      const seat = r.seats && r.seats[legNum] ? r.seats[legNum] : null;
      if(seat) legsClone[legId].seat = seat;
    });
    return {
      key:'p'+Date.now()+Math.random().toString(36).slice(2,6),
      title:r.title, surname:r.surname.toUpperCase(), given:(r.given||'GIVENNAME').toUpperCase(),
      dob:r.dob, passportNumber:r.passport.toUpperCase(), nationality:r.nationality.toUpperCase(), passportExpiry:r.expiry,
      cls:r.cls, group:'-', eTicket: genETicket(),
      legs: legsClone,
      bags:0, bagWeights:[], bagTags:[]
    };
  });

  STATE.bookings.push({ pnr, legs:legIds, passengers });
  pnrDraft = newPnrDraft();
  saveState(); render();
}
let toastTimer = null;
function notify(msg, type){
  type = type || 'err';
  const el = document.getElementById('toastbar');
  if(!el) return;
  el.innerHTML = `<div class="toast ${type}"><span>${msg}</span><button onclick="document.getElementById('toastbar').innerHTML=''">✕</button></div>`;
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.innerHTML=''; }, 4500);
}

function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }

let editingFlightId = null;

function validateFlightForm(){
  const no = val('nf-no'), date = val('nf-date'), from = val('nf-from').toUpperCase(), to = val('nf-to').toUpperCase(), reg = val('nf-aircraft');
  if(!no) return 'Enter a flight number.';
  if(!date) return 'Select a date.';
  if(from.length!==3) return 'From (IATA) must be exactly 3 letters.';
  if(to.length!==3) return 'To (IATA) must be exactly 3 letters.';
  if(from===to) return 'From and To cannot be the same airport.';
  if(!reg) return 'Select a registered aircraft (register one first in Aircraft Registry if the list is empty).';
  return null;
}

function addDaysISO(dateStr, n){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function addFlight(){
  const err = validateFlightForm();
  if(err) return notify(err);
  const reg = val('nf-aircraft');
  const ac = getAircraftByReg(reg);
  const startDate = val('nf-date');
  const endDateRaw = val('nf-date-end');

  const dates = [startDate];
  if(endDateRaw){
    if(endDateRaw < startDate) return notify('"Repeat Daily Until" must be on or after the Date field.');
    let d = startDate;
    while(d < endDateRaw){
      d = addDaysISO(d,1);
      dates.push(d);
    }
  }

  dates.forEach((dateStr,i)=>{
    STATE.flights.push({
      id: 'f'+Date.now()+'_'+i,
      flightNo:val('nf-no'), date:dateStr,
      from:val('nf-from').toUpperCase(), fromCity:(val('nf-fromcity')||val('nf-from')).toUpperCase(),
      to:val('nf-to').toUpperCase(), toCity:(val('nf-tocity')||val('nf-to')).toUpperCase(),
      tailNumber: reg, aircraft: ac?ac.typeLabel:'UNKNOWN',
      gate: val('nf-gate')||'-', boarding: val('nf-board')||'--:--', std: val('nf-std')||'--:--',
      bpStyle: val('nf-bpstyle')||'turkish', airlineName: val('nf-airline')||'',
      operatingAirline: val('nf-operatedby')||'', terminal: val('nf-terminal')||'',
      bagAllowance: {
        economy: parseInt(val('nf-bag-eco'))||20,
        premium: parseInt(val('nf-bag-prem'))||25,
        business: parseInt(val('nf-bag-biz'))||30
      },
      archived:false
    });
  });

  if(dates.length>1) notify(`Created ${dates.length} flight entries for ${val('nf-no')}, ${startDate} → ${endDateRaw}.`, 'ok');
  saveState(); render();
}

let pendingDeleteFlightId = null;
function deleteFlight(id){
  const inUse = STATE.bookings.some(b=>b.legs.includes(id));
  if(inUse) return notify('This flight is used by one or more PNRs and cannot be deleted. Delete or edit those PNRs first.');
  if(pendingDeleteFlightId!==id){ pendingDeleteFlightId=id; render(); return; }
  STATE.flights = STATE.flights.filter(f=>f.id!==id);
  pendingDeleteFlightId = null;
  if(editingFlightId===id) editingFlightId = null;
  if(STATE.selection.flightId===id) STATE.selection.flightId = STATE.flights[0]?.id || null;
  saveState(); render();
}

let showArchived = false;

function archiveFlight(id){
  const f = STATE.flights.find(x=>x.id===id);
  if(!f) return;
  f.archived = true;
  if(STATE.selection.flightId===id){
    const next = STATE.flights.find(x=>!x.archived);
    if(next) STATE.selection.flightId = next.id;
  }
  saveState(); render();
  notify(`${f.flightNo} archived.`, 'ok');
}

function unarchiveFlight(id){
  const f = STATE.flights.find(x=>x.id===id);
  if(!f) return;
  f.archived = false;
  saveState(); render();
}

function archiveAllPastFlights(){
  const todayISO = new Date().toISOString().slice(0,10);
  let count = 0;
  STATE.flights.forEach(f=>{
    if(!f.archived && f.date<todayISO){ f.archived = true; count++; }
  });
  if(count>0 && STATE.selection.flightId){
    const cur = STATE.flights.find(x=>x.id===STATE.selection.flightId);
    if(cur && cur.archived){
      const next = STATE.flights.find(x=>!x.archived);
      if(next) STATE.selection.flightId = next.id;
    }
  }
  saveState(); render();
  notify(`Archived ${count} past flight(s).`, 'ok');
}


function genPNR(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'; let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }

function genETicket(){
  STATE.eTicketCounter = (STATE.eTicketCounter||0)+1;
  const serial = String(STATE.eTicketCounter).padStart(10,'0');
  return `${AIRLINE.btic}-${serial}`; // standard 13-digit e-ticket format: 3-digit airline numeric code + 10-digit serial
}

function apisStatus(p,f){
  if(!p.passportNumber || !p.nationality || !p.passportExpiry || !p.dob) return {ok:false, reason:'Passport data incomplete'};
  const flightDate = new Date(f.date+"T00:00:00");
  const expiry = new Date(p.passportExpiry+"T00:00:00");
  if(isNaN(expiry.getTime())) return {ok:false, reason:'Invalid expiry date'};
  if(expiry < flightDate) return {ok:false, reason:'Passport expired before flight date'};
  return {ok:true, reason:'Passport valid'};
}

    <small class="hint">Add rows in a range (same seat pattern repeated) or one row at a time (for irregular layouts — e.g. row 1 wider than the rest). Seat Groups pattern: letters within a block sit together, "|" marks an aisle. Example "A|CD|GH|K" renders a 1-2-2-1 layout.</small>
    </div>
  </div>
  `;
}

function renderAcClassBuilder(cls){
  const rowsList = (acDraft.classes[cls]||[]).slice().sort((a,b)=>a.row-b.row);
  const rowsTable = rowsList.length ? `
    <table style="margin-top:6px">
      <thead><tr><th>Row</th><th>Groups</th><th>Exit</th><th></th></tr></thead>
      <tbody>${rowsList.map(rd=>`<tr ${rd.exitRow?'style="background:#fdecec"':''}><td>${rd.row}</td><td>${groupsToPattern(rd.groups)}</td><td>${rd.exitRow?'<span class="badge pending">EXIT</span>':''}</td><td><button class="btn small secondary" onclick="toggleAcDraftRowExit('${cls}',${rd.row})">${rd.exitRow?'Unmark':'Mark Exit'}</button> <button class="btn small danger" onclick="removeAcDraftRow('${cls}',${rd.row})">✕</button></td></tr>`).join('')}</tbody>
    </table>` : `<small class="hint">No rows yet for ${classLabel(cls)}.</small>`;

  return `
  <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px;">
    <b style="font-size:12px;color:var(--navy-dk)">${classLabel(cls)}</b>
    ${rowsTable}
    <div class="row" style="margin-top:8px">
      <div class="field"><label>Row Start</label><input id="ac-${cls}-start" type="number" min="1" style="width:70px"></div>
      <div class="field"><label>Row End</label><input id="ac-${cls}-end" type="number" min="1" style="width:70px"></div>
      <div class="field"><label>Seat Groups (pipe = aisle)</label><input id="ac-${cls}-groups" placeholder="ABC|DEFG|HJK" style="width:160px"></div>
      <div class="field"><label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="ac-${cls}-exit" style="min-width:auto;width:auto"> Emergency Exit Row</label></div>
      <button class="btn secondary small" onclick="addAcDraftRange('${cls}')">+ Add Row Range</button>
    </div>
    <div class="row" style="margin-top:6px">
      <div class="field"><label>Single Row No.</label><input id="ac-${cls}-singlerow" type="number" min="1" style="width:70px"></div>
      <div class="field"><label>Seat Groups (pipe = aisle)</label><input id="ac-${cls}-singlegroups" placeholder="A|CD|GH|K" style="width:160px"></div>
      <div class="field"><label style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="ac-${cls}-singleexit" style="min-width:auto;width:auto"> Emergency Exit Row</label></div>
      <button class="btn secondary small" onclick="addAcDraftSingleRow('${cls}')">+ Add / Replace Single Row</button>
    </div>
  </div>`;
}

function newAcDraft(){
  return { editingReg:null, reg:'', typeLabel:'', classes:{business:[],premium:[],economy:[]} };
}
let acDraft = newAcDraft();

function prefillAcDraft(name){
  const tpl = AIRCRAFT_PRESETS[name];
  acDraft.typeLabel = name.replace(/\s*\(.*\)/,'');
  ['business','premium','economy'].forEach(cls=>{
    acDraft.classes[cls] = normalizeAcClass(tpl[cls]);
  });
  render();
}

function clearAcDraft(){ acDraft = newAcDraft(); render(); }

function startEditAircraft(reg){
  const ac = getAircraftByReg(reg);
  if(!ac) return;
  acDraft = {
    editingReg: reg, reg: ac.reg, typeLabel: ac.typeLabel,
    classes: { business: classRowDefs(ac,'business'), premium: classRowDefs(ac,'premium'), economy: classRowDefs(ac,'economy') }
  };
  render();
}

function addAcDraftRange(cls){
  const start = parseInt(val(`ac-${cls}-start`));
  const end = parseInt(val(`ac-${cls}-end`));
  const groups = parseGroups(val(`ac-${cls}-groups`)||'');
  const exitRow = !!document.getElementById(`ac-${cls}-exit`)?.checked;
  if(!start || !end || end<start) return notify('Enter a valid row start/end.');
  if(groups.length===0) return notify('Enter a seat groups pattern, e.g. ABC|DEFG|HJK.');
  const list = acDraft.classes[cls];
  for(let r=start; r<=end; r++){
    const existing = list.find(rd=>rd.row===r);
    if(existing){ existing.groups = groups; existing.exitRow = exitRow; }
    else list.push({ row:r, groups, exitRow });
  }
  render();
}

function addAcDraftSingleRow(cls){
  const row = parseInt(val(`ac-${cls}-singlerow`));
  const groups = parseGroups(val(`ac-${cls}-singlegroups`)||'');
  const exitRow = !!document.getElementById(`ac-${cls}-singleexit`)?.checked;
  if(!row) return notify('Enter a row number.');
  if(groups.length===0) return notify('Enter a seat groups pattern, e.g. A|CD|GH|K.');
  const list = acDraft.classes[cls];
  const existing = list.find(rd=>rd.row===row);
  if(existing){ existing.groups = groups; existing.exitRow = exitRow; }
  else list.push({ row, groups, exitRow });
  render();
}

function toggleAcDraftRowExit(cls, row){
  const rd = acDraft.classes[cls].find(x=>x.row===row);
  if(rd) rd.exitRow = !rd.exitRow;
  render();
}

function removeAcDraftRow(cls, row){
  acDraft.classes[cls] = acDraft.classes[cls].filter(rd=>rd.row!==row);
  render();
}

function submitAcDraft(){
  const reg = acDraft.reg.trim().toUpperCase();
  if(!reg) return notify('Enter a registration (tail number).');
  const typeLabel = acDraft.typeLabel.trim() || reg;
  const existingOther = getAircraftByReg(reg);
  if(!acDraft.editingReg && existingOther) return notify('This registration already exists in the registry.');
  if(acDraft.editingReg && existingOther && reg!==acDraft.editingReg) return notify('Another aircraft already uses that registration.');

  const classes = {
    business: acDraft.classes.business.length ? acDraft.classes.business.slice() : null,
    premium: acDraft.classes.premium.length ? acDraft.classes.premium.slice() : null,
    economy: acDraft.classes.economy.length ? acDraft.classes.economy.slice() : null
  };
  if(!classes.business && !classes.premium && !classes.economy){
    return notify('Add at least one row to at least one cabin class.');
  }

  if(acDraft.editingReg){
    const ac = getAircraftByReg(acDraft.editingReg);
    const oldReg = ac.reg;
    ac.reg = reg; ac.typeLabel = typeLabel; ac.classes = classes;
    if(oldReg !== reg){
      STATE.flights.forEach(f=>{ if(f.tailNumber===oldReg) f.tailNumber = reg; });
    }
  }else{
    STATE.aircraftRegistry.push({ reg, typeLabel, classes });
  }
  acDraft = newAcDraft();
  saveState(); render();
}

function deleteAircraft(reg){
  if(STATE.flights.some(f=>f.tailNumber===reg)) return notify('This aircraft is assigned to a flight and cannot be deleted.');
  STATE.aircraftRegistry = STATE.aircraftRegistry.filter(a=>a.reg!==reg);
  if(acDraft.editingReg===reg) acDraft = newAcDraft();
  saveState(); render();
}

let addPaxFormOpen = false;
function toggleAddPaxForm(){ addPaxFormOpen = !addPaxFormOpen; render(); }

let pendingDeletePnr = null;
function deletePnr(pnr){
  const booking = STATE.bookings.find(b=>b.pnr===pnr);
  if(!booking) return;
  if(pendingDeletePnr!==pnr){
    pendingDeletePnr=pnr;
    const anyCheckedIn = booking.passengers.some(p=> Object.values(p.legs).some(l=>l.checkedIn));
    if(anyCheckedIn) notify('This PNR has checked-in passenger(s) — confirming will discard their boarding passes and bag tags.', 'err');
    render(); return;
  }
  STATE.bookings = STATE.bookings.filter(b=>b.pnr!==pnr);
  pendingDeletePnr = null;
  STATE.selection.pnr = null; STATE.selection.passengerKey = null;
  saveState(); render();
}
function cancelDeletePnr(){ pendingDeletePnr=null; render(); }

function addPaxToExistingPnr(pnr){
  const booking = STATE.bookings.find(b=>b.pnr===pnr);
  if(!booking) return;
  const surname = val('ap-surname');
  if(!surname) return notify('Enter a surname.');
  const cls = val('ap-cls');

  for(const fid of booking.legs){
    const flight = STATE.flights.find(fl=>fl.id===fid);
    if(!flight) continue;
    const ac = getAircraftByReg(flight.tailNumber);
    if(!ac) continue;
    const capacity = classSeatCapacity(ac, cls);
    const already = classBookedCount(fid, cls);
    if(already + 1 > capacity){
      return notify(`No ${classLabel(cls)} seats remaining on ${flight.flightNo} (${flight.from}-${flight.to}) — that class is full on this flight.`);
    }
  }

  const legsState = {};
  booking.legs.forEach(fid=>{ legsState[fid] = { seat:null, checkedIn:false, seq:null, boarded:false }; });
  booking.passengers.push({
    key:'p'+Date.now()+Math.random().toString(36).slice(2,6),
    title: val('ap-title'), surname: surname.toUpperCase(), given:(val('ap-given')||'GIVENNAME').toUpperCase(),
    dob: val('ap-dob'), passportNumber: val('ap-passport').toUpperCase(), nationality: val('ap-nationality').toUpperCase(),
    passportExpiry: val('ap-expiry'), cls, group:'-', eTicket: genETicket(),
    legs: legsState, bags:0, bagWeights:[], bagTags:[]
  });
  addPaxFormOpen = false;
  saveState(); render();
}

let pendingRemovePaxKey = null;
function removePaxFromPnr(pnr,key){
  const booking = STATE.bookings.find(b=>b.pnr===pnr);
  if(!booking) return;
  const pax = booking.passengers.find(p=>p.key===key);
  const anyCheckedIn = pax && Object.values(pax.legs).some(l=>l.checkedIn);
  if(anyCheckedIn) return notify('This passenger is already checked in on at least one leg and cannot be removed. Delete the whole PNR if needed.');
  if(pendingRemovePaxKey!==key){ pendingRemovePaxKey=key; render(); return; }
  booking.passengers = booking.passengers.filter(p=>p.key!==key);
  pendingRemovePaxKey = null;
  if(booking.passengers.length===0){ STATE.bookings = STATE.bookings.filter(b=>b.pnr!==pnr); STATE.selection.pnr=null; }
  saveState(); render();
}
function cancelRemovePax(){ pendingRemovePaxKey=null; render(); }

function legChainLabel(booking){
  const legs = booking.legs.map(id=>STATE.flights.find(f=>f.id===id)).filter(Boolean);
  if(legs.length===0) return '—';
  return legs.map(f=>f.flightNo).join('→');
}
function legRouteLabel(booking){
  const legs = booking.legs.map(id=>STATE.flights.find(f=>f.id===id)).filter(Boolean);
  if(legs.length===0) return '—';
  return legs.map(f=>f.from).concat([legs[legs.length-1].to]).join(' → ');
}

let paxSearchQuery = '';
function onPaxSearchInput(v){

  if(el) el.innerHTML = renderPaxSearchResultsHTML();
}
function renderPaxSearchResultsHTML(){
  const q = paxSearchQuery.trim().toUpperCase();
  if(!q) return `<small class="hint">Start typing to search PNRs on this flight.</small>`;
  const flightId = STATE.selection.flightId;
  const matches = [];
  STATE.bookings.filter(b=>b.legs.includes(flightId)).forEach(b=>{
    b.passengers.forEach(p=>{
      if(p.surname && p.surname.toUpperCase().includes(q)){
        matches.push({ b, p });
      }
    });
  });
  if(matches.length===0) return `<small class="hint">No passenger surname matches "${paxSearchQuery}" on this flight.</small>`;
  const rows = matches.map(({b,p})=>{

      <td><span class="badge ${ls.checkedIn?'ok':'pending'}">${ls.checkedIn?'CHECKED-IN':'NOT CHECKED-IN'}</span></td>
      <td><button class="btn small secondary" onclick="goToPassenger('${flightId}','${b.pnr}','${p.key}')">Select →</button></td>
    </tr>`;

    <table>
      <thead><tr><th>Passenger</th><th>Title</th><th>PNR</th><th>Cl</th><th>Status</th><th></th></tr></thead>

}
function goToPassenger(flightId,pnr,key){

  STATE.selection.pnr = pnr;

  paxSearchQuery = '';

}

function setPaxTitle(pnr,key,v){
  const b=STATE.bookings.find(x=>x.pnr===pnr); const p=b.passengers.find(x=>x.key===key);
  p.title = v; saveState(); render();
}
function setPaxClass(pnr,key,v){
  const b=STATE.bookings.find(x=>x.pnr===pnr); const p=b.passengers.find(x=>x.key===key);
  if(p.cls!==v){ p.cls = v; Object.keys(p.legs).forEach(fid=>{ p.legs[fid].seat=null; }); } // all leg seats cleared: seat ranges are class-specific
  saveState(); render();
}
function setPaxPassport(pnr,key,field,v){
  const b=STATE.bookings.find(x=>x.pnr===pnr); const p=b.passengers.find(x=>x.key===key);
  p[field] = v; saveState(); render();
}
function setPaxGroup(pnr,key,v){
  const b=STATE.bookings.find(x=>x.pnr===pnr); const p=b.passengers.find(x=>x.key===key);
  p.group = v; saveState();
}
function addBagRow(pnr,key){
  const b=STATE.bookings.find(x=>x.pnr===pnr); const p=b.passengers.find(x=>x.key===key);
  if(p.bagTags && p.bagTags.length) return notify('Bags are already tagged through for this passenger.');
  if(!p.bagWeights) p.bagWeights=[];
  if(p.bagWeights.length>=9) return notify('Maximum 9 bags per passenger in this simulation.');
  const refFlightId = (STATE.selection.flightId && b.legs.includes(STATE.selection.flightId)) ? STATE.selection.flightId : b.legs[0];
  const refFlight = STATE.flights.find(fl=>fl.id===refFlightId);
  const defaultW = (refFlight && refFlight.bagAllowance && refFlight.bagAllowance[p.cls]) || {economy:20,premium:25,business:30}[p.cls] || 20;
  p.bagWeights.push(defaultW);
  saveState(); render();
}
function removeBagRow(pnr,key,idx){
  const b=STATE.bookings.find(x=>x.pnr===pnr); const p=b.passengers.find(x=>x.key===key);
  p.bagWeights.splice(idx,1);
  saveState(); render();
}
function setBagWeight(pnr,key,idx,v){
  const b=STATE.bookings.find(x=>x.pnr===pnr); const p=b.passengers.find(x=>x.key===key);
  const w = Math.max(0, parseFloat(v)||0);
  if(w>32){
    notify(`This bag is ${w}kg — over the 32kg IATA maximum handling limit. It cannot be checked in at this weight; it must be split into smaller pieces or repacked.`, 'err');
    render(); // redraw the input back to its last valid stored value
    return;
  }
  p.bagWeights[idx] = w;
  saveState();
}

function startSeatSelectForLeg(pnr,key,flightId){
  STATE.selection.pnr = pnr; STATE.selection.passengerKey = key; STATE.selection.seatLegId = flightId; render();
}

function drawSeatmapIfNeeded(){
  if(!STATE.selection.passengerKey) return;
  const flight = STATE.flights.find(f=>f.id===STATE.selection.seatLegId) || STATE.flights.find(f=>f.id===STATE.selection.flightId);
  const booking = STATE.bookings.find(b=>b.pnr===STATE.selection.pnr);
  const pax = booking.passengers.find(p=>p.key===STATE.selection.passengerKey);
  if(!flight || !booking.legs.includes(flight.id)){
    document.getElementById('seatmap-container').innerHTML = '<div class="empty">This passenger is not booked on that flight leg.</div>'; return;
  }
  const ac = getAircraftByReg(flight.tailNumber);
  if(!ac){ document.getElementById('seatmap-container').innerHTML = '<div class="empty">This flight has no registered aircraft/cabin layout.</div>'; return; }
  const takenIds = new Set();
  STATE.bookings.filter(b=>b.legs.includes(flight.id)).forEach(b=>b.passengers.forEach(p=>{ const s=p.legs[flight.id]?.seat; if(s) takenIds.add(s); }));
  const curSeat = pax.legs[flight.id]?.seat;

  const masterLetters = getMasterLetters(ac);
  const aisleBefore = getAisleBeforeSet(ac);
  const gridCols = `24px repeat(${masterLetters.length}, 26px) auto`;

  let html = '<div class="seatmap">';
  ['business','premium','economy'].forEach(cls=>{
    classRowDefs(ac, cls).forEach(rd=>{
      const rowNum = rd.row;
      const rowLetters = new Set();
      rd.groups.forEach(g=>g.forEach(l=>rowLetters.add(l)));
      html += `<div class="seatrow ${rd.exitRow?'exitrow':''}" style="display:grid;grid-template-columns:${gridCols};align-items:center;gap:3px;">`;
      html += `<div class="rownum">${rowNum}${rd.exitRow?' <span class="exit-tag" title="Emergency Exit Row">EXIT</span>':''}</div>`;
      masterLetters.forEach(letter=>{
        const gapStyle = aisleBefore.has(letter) ? 'margin-left:8px;' : '';
        if(rowLetters.has(letter)){
          const id = rowNum+letter;
          const isTaken = takenIds.has(id) && curSeat!==id;
          const isSelected = curSeat===id;
          html += `<div class="seat ${cls} ${rd.exitRow?'exitrow':''} ${isTaken?'taken':''} ${isSelected?'selected':''}" style="${gapStyle}" ${isTaken?'':`onclick="pickSeat('${id}','${cls}',${rd.exitRow?'true':'false'})"`}>${letter}</div>`;
        }else{
          html += `<div class="seat-blank" style="${gapStyle}"></div>`;
        }
      });
      html += `<span class="badge ${cls}" style="margin-left:8px;justify-self:start;width:fit-content;">${classLabel(cls)}</span></div>`;
    });
  });
  html += '</div>';
  document.getElementById('seatmap-container').innerHTML = html;
}

function pickSeat(seatId,cls,isExit){
  const booking = STATE.bookings.find(b=>b.pnr===STATE.selection.pnr);
  const pax = booking.passengers.find(p=>p.key===STATE.selection.passengerKey);
  const flightId = STATE.selection.seatLegId || STATE.selection.flightId;
  if(!pax.legs[flightId]) pax.legs[flightId] = { seat:null, checkedIn:false, seq:null, boarded:false };
  pax.legs[flightId].seat = seatId; pax.cls = cls;
  saveState(); render();
  if(isExit && pax.title==='CHD'){
    notify(`${pax.surname}/${pax.given} is a child (CHD) seated in an emergency exit row — airline policy normally requires reassignment.`, 'err');
  }
}

function autoAssignSeat(flightId, cls, excludePassengerKey){
  const flight = STATE.flights.find(f=>f.id===flightId);
  if(!flight) return null;
  const ac = getAircraftByReg(flight.tailNumber);
  if(!ac || !ac.classes[cls]) return null;
  const seats = buildSeatList(flight.tailNumber).filter(s=>s.cls===cls);
  const takenIds = new Set();
  STATE.bookings.filter(b=>b.legs.includes(flightId)).forEach(b=>b.passengers.forEach(p=>{
    if(p.key===excludePassengerKey) return;
    const s=p.legs[flightId]?.seat; if(s) takenIds.add(s);
  }));
  const free = seats.filter(s=>!takenIds.has(s.id));
  if(free.length===0) return null;
  return free[Math.floor(Math.random()*free.length)].id; // random pick among available seats in class
}


function checkInPassengerLeg(pnr,key,flightId){
  const flight = STATE.flights.find(f=>f.id===flightId);
  const booking = STATE.bookings.find(b=>b.pnr===pnr);
  const pax = booking.passengers.find(p=>p.key===key);
  if(!pax.legs[flightId]) pax.legs[flightId] = { seat:null, checkedIn:false, seq:null, boarded:false };
  const legState = pax.legs[flightId];
  if(!legState.seat){
    const auto = autoAssignSeat(flightId, pax.cls, pax.key);
    if(!auto) return notify('No seats available in this class on this leg — assign one manually or free up a seat.');
    legState.seat = auto;
  }
  STATE.seqCounters[flightId] = (STATE.seqCounters[flightId]||0)+1;
  legState.seq = String(STATE.seqCounters[flightId]).padStart(3,'0');
  legState.checkedIn = true;
  ensureThroughBagTags(booking, pax);
  saveState(); render();
}

function checkInAllForFlight(){
  const flightId = STATE.selection.flightId;
  const flight = STATE.flights.find(f=>f.id===flightId);
  if(!flight) return;
  let checkedCount=0, throughCount=0, skippedNoSeat=0;
  STATE.bookings.filter(b=>b.legs.includes(flightId)).forEach(b=>{
    b.passengers.forEach(p=>{
      const isTransfer = b.legs.length>1;
      let anyLegChecked = false, anyLegFailed = false;
      b.legs.forEach(legId=>{
        if(!p.legs[legId]) p.legs[legId] = { seat:null, checkedIn:false, seq:null, boarded:false };
        const ls = p.legs[legId];
        if(ls.checkedIn) return; // already checked in on this leg, leave as is
        if(!ls.seat){
          const auto = autoAssignSeat(legId, p.cls, p.key);
          if(!auto){ anyLegFailed = true; return; } // no seats left in that class on this leg
          ls.seat = auto;
        }
        STATE.seqCounters[legId] = (STATE.seqCounters[legId]||0)+1;
        ls.seq = String(STATE.seqCounters[legId]).padStart(3,'0');
        ls.checkedIn = true;
        anyLegChecked = true;
      });
      if(anyLegChecked){
        ensureThroughBagTags(b, p);
        checkedCount++;
        if(isTransfer) throughCount++;
      }
      if(anyLegFailed) skippedNoSeat++;
    });
  });
  saveState(); render();
  let msg = `Checked in ${checkedCount} passenger(s) for ${flight.flightNo}${throughCount?` (${throughCount} through their full transfer itinerary)`:''}.`;
  if(skippedNoSeat) msg += ` ${skippedNoSeat} could not be fully seated on every leg (class full somewhere).`;
  notify(msg, skippedNoSeat ? 'err' : 'ok');
}

function checkInAllLegsThrough(pnr,key){
  const booking = STATE.bookings.find(b=>b.pnr===pnr);
  const pax = booking.passengers.find(p=>p.key===key);
  booking.legs.forEach(flightId=>{
    const legState = pax.legs[flightId];
    if(!legState || legState.checkedIn) return;
    if(!legState.seat){
      const auto = autoAssignSeat(flightId, pax.cls, pax.key);
      if(!auto){ return; } // no seats available on this leg — leave unchecked, agent can resolve manually
      legState.seat = auto;
    }
    STATE.seqCounters[flightId] = (STATE.seqCounters[flightId]||0)+1;
    legState.seq = String(STATE.seqCounters[flightId]).padStart(3,'0');
    legState.checkedIn = true;
  });
  ensureThroughBagTags(booking, pax);
  saveState(); render();
}

function ensureThroughBagTags(booking, pax){
  if(pax.bagTags && pax.bagTags.length) return; // already tagged
  const weights = pax.bagWeights || [];
  if(weights.length===0) return;
  const lastLegId = booking.legs[booking.legs.length-1];
  pax.bags = weights.length;
  pax.bagTags = [];
  weights.forEach(w=>{
    const safeW = Math.min(w, 32); // hard IATA handling cap — defense in depth alongside setBagWeight's own check
    STATE.bagCounters[lastLegId] = (STATE.bagCounters[lastLegId]||0)+1;
    const serial = String(STATE.bagCounters[lastLegId]).padStart(6,'0');
    pax.bagTags.push({ lp:`0${AIRLINE.btic}${serial}`, weight:safeW }); // 10-digit license plate: 0 + BTIC(3) + serial(6)
  });
}

function checkedInLegsList(){
  const list = [];
  const activeFlightId = STATE.selection.flightId;
  STATE.bookings.forEach(b=>{
    if(!b.legs.includes(activeFlightId)) return; // only the currently selected flight
    const flightId = activeFlightId;
    const f = STATE.flights.find(fl=>fl.id===flightId);
    if(!f) return;
    b.passengers.forEach(p=>{
      const legState = p.legs[flightId];
      if(legState && legState.checkedIn){
        list.push({ uid: p.key+'@'+flightId, pax:p, flight:f, pnr:b.pnr, legState });
      }
    });
  });
  return list;
}
function flattenPaxForLeg(pax, legState, pnr){
  return { ...pax, pnr, seat: legState.seat, seq: legState.seq, boarded: legState.boarded, checkedIn: legState.checkedIn };
}

  const list = checkedInLegsList();
  if(list.length===0) return `<div class="panel"><div class="panel-body empty">No checked-in passengers yet for this flight. Check in a passenger in the Check-In tab, or switch flights at the top.</div></div>`;
  const sel = STATE.selection.passForPass && list.find(x=>x.uid===STATE.selection.passForPass) ? STATE.selection.passForPass : list[0].uid;

  return `

      <div class="field"><label>Passenger / Leg</label>

          ${list.map(x=>`<option value="${x.uid}" ${x.uid===sel?'selected':''}>${x.pax.surname}/${x.pax.given} · ${x.flight.flightNo} · ${x.legState.seat}</option>`).join('')}

    </div>

/* Renders a REAL, standards-compliant PDF417 barcode (via bwip-js) at natural
   orientation onto an offscreen canvas, then composites it rotated 90° onto the
   visible canvas so it reads top-to-bottom like the printed TK stock — same data
   the Boarding Gate camera (ZXing BrowserPDF417Reader) decodes back. */
function renderVerticalPDF417(canvasEl, text){
  const off = document.createElement('canvas');
  bwipjs.toCanvas(off, {
    bcid:'pdf417', text:text, scale:3, columns:8, rowheight:3,
    includetext:false, backgroundcolor:'FFFFFF', paddingwidth:4, paddingheight:4
  });
  const outW = 300, outH = 640;
  canvasEl.width = outW; canvasEl.height = outH;
  const ctx = canvasEl.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,outW,outH);
  ctx.save();
  ctx.translate(outW/2, outH/2);
  ctx.rotate(-Math.PI/2);
  const scale = Math.min(outW/off.height, outH/off.width) * 0.98;
  ctx.scale(scale, scale);
  ctx.drawImage(off, -off.width/2, -off.height/2);
  ctx.restore();
}

/* Compact, NOT rotated PDF417 — used by styles (e.g. Çelebi) whose real stock
   prints the barcode as a small square-ish block inline with other fields,
   rather than as a tall strip running the full height of the coupon. */
function renderCompactPDF417(canvasEl, text){
  try{
    bwipjs.toCanvas(canvasEl, {
      bcid:'pdf417', text:text, scale:2, columns:6, rowheight:2,
      includetext:false, backgroundcolor:'FFFFFF', paddingwidth:3, paddingheight:3
    });
  }catch(e){ console.error('Compact PDF417 render failed', e); }
}

function drawBoardingPassBarcode(){
  document.querySelectorAll('canvas[id^="pdf417-"]').forEach(el=>{
    const text = decodeURIComponent(el.dataset.bcbp);
    try{ renderVerticalPDF417(el, text); }
    catch(e){ console.error('PDF417 render failed', e); }
  });
  document.querySelectorAll('canvas[id^="pdf417flat-"]').forEach(el=>{
    const text = decodeURIComponent(el.dataset.bcbp);
    renderCompactPDF417(el, text);
  });
  document.querySelectorAll('canvas[id^="code128bp-"]').forEach(el=>{
    const code = el.dataset.code;
    try{
      bwipjs.toCanvas(el, {
        bcid:'code128', text:code, scale:2, height:12,
        includetext:false, backgroundcolor:'FFFFFF', paddingwidth:2, paddingheight:1
      });
    }catch(e){ console.error('Code128 (boarding pass) render failed', e); }
  });
}

function paxWithBagsList(){
  const list = [];

    b.passengers.forEach(p=>{
      if(p.bagTags && p.bagTags.length>0){
        const legs = b.legs.map(id=>STATE.flights.find(f=>f.id===id)).filter(Boolean);
        list.push({ pax:p, booking:b, legs });

  return list;
}

    <div class="city">${arrLeg.to}</div>
    <div class="bottomrow"><span>${arrLeg.flightNo}</span><span>${fmtDate(arrLeg.date)}</span></div>
  </div>`;
}

function destViaBlockHTML(p,legs,destFlight){
  const viaBox1 = viaBoxHTML(0, legs);

    </div>

    <div class="databox">
      <div class="row">NME:${p.surname}/${p.given.slice(0,3)}</div>
      <div class="row">${fmtDate(originFlight.date)} &nbsp; ${bagCount}/${bagWeightField} &nbsp; ${originFlight.from} &nbsp; ${p.pnr}</div>

    <div class="barblock">

    </div>
  </div>`;
